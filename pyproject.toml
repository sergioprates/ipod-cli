[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipod-sync"
version = "0.1.0"
description = "High-performance CLI for managing and syncing iPods (Classic, Mini, Nano, Video) without iTunes"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Hermes & Co." }
]
keywords = [
    "ipod",
    "ipod-classic",
    "ipod-video",
    "itunesdb",
    "music-sync",
    "ipod-cli",
    "alac",
    "ffmpeg",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "mutagen>=1.47.0",
    "pillow>=10.0.0",
    "pycryptodome>=3.20.0",
    "wasmtime>=36.0.0",
    "tzdata>=2024.1",
]

[project.scripts]
ipod = "ipod_cli.main:app"
ipod-sync = "ipod_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ipod_cli",
    "src/iPodDB",
    "src/device_registry",
    "src/storage",
]
